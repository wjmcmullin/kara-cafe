services:
  kara-cafe-app:
    image: quay.io/wildfly/wildfly:latest
    container_name: kara-cafe
    hostname: karacafe
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgreskara:5432/kara
      DB_USER: postgres
      DB_PASSWORD: root
      KARA_SUPER_ADMIN_USERNAME: superadmin
      KARA_SUPER_ADMIN_PASSWORD: admin
      KARA_PUBLIC_BASE_URL: http://192.168.1.59:8080
      KARAOKE_VIDEO_DIR: /kara-cafe/videos
    volumes:
      - .\target\kara-cafe.war:/opt/jboss/wildfly/standalone/deployments/kara-cafe.war:ro
      - .\videos:/kara-cafe/videos
    networks:
      - wildfly_server_net
  postgres:
    image: postgres:18-alpine
    container_name: kara-postgres
    hostname: postgreskara
    environment:
      POSTGRES_DB: kara
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - .\db:/var/lib/postgresql
      - .\db\storage:/app/server/storage
    networks:
      - wildfly_server_net
networks:
  wildfly_server_net:
    name: wildfly_server_net
    external: true      
volumes:
  postgres_db:
    name: kara_postgres_db
