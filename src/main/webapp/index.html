<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kara Café Login</title>
    <base href="/kara-cafe/" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <meta name="description" content="Login to Kara Café.">
</head>

<body class="login">
    <div class="card login-card">
        <h1>Kara Café</h1>
        <p>Sign in with your credentials to manage karaoke rooms.</p>
        <form id="loginForm">
            <label class="field">
                <span>Username</span>
                <input name="username" type="text" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" />
            </label>
            <label class="field">
                <span>Password</span>
                <input name="password" type="password" required autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" />
            </label>
            <button type="submit" class="button">Sign in</button>
            <p id="feedback" class="subtext"></p>
        </form>
    </div>
    <script src="assets/js/login.js"></script>
</body>

</html>
