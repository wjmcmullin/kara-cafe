<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Search Karaoke Videos</title>
    <base href="/kara-cafe/" />
    <link rel="stylesheet" href="assets/css/styles.css?v=20261010-2" />
</head>

<body class="room">
    <div class="room-page">
        <nav class="room-nav">
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="roomNavLinks">Menu</button>
            <div id="roomNavLinks" class="room-nav-links">
                <a id="backToRoomLink" class="link" href="#">← Back to Room</a>
                <button id="searchLogoutButton" class="link-button logout-button" type="button">Log out</button>
            </div>
        </nav>

        <section class="room-card">
            <h1>Search for karaoke videos</h1>
            <p class="subtext">
                Karaoke videos are automatically loaded from the configured server directory.
            </p>

            <p class="subtext">
                Directory: <span id="configuredDirectory">Loading…</span>
            </p>

            <div id="searchStatus" class="subtext"></div>

            <div class="invite-section">
                <p class="subtext"><strong>Available karaoke files</strong></p>
                <ul id="videoResults" class="invite-list"></ul>
            </div>
        </section>
    </div>

    <script src="assets/js/mobile-nav.js?v=20261010-2"></script>
    <script src="assets/js/search-room.js?v=20261010-2"></script>
</body>

</html>
